name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release-linux:
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build static Linux binaries (x86_64 and aarch64)
        run: |
          mkdir -p dist
          for arch in x86_64 aarch64; do
            zig build -Doptimize=ReleaseSafe -Dtarget=${arch}-linux --prefix "dist/${arch}"
            cp "dist/${arch}/bin/omnicode" dist/omnicode
            tar -czf "dist/omnicode-linux-${arch}.tar.gz" -C dist omnicode
            rm -f dist/omnicode
          done
          (cd dist && sha256sum omnicode-linux-x86_64.tar.gz omnicode-linux-aarch64.tar.gz > SHA256SUMS)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/omnicode-linux-x86_64.tar.gz dist/omnicode-linux-aarch64.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/omnicode-linux-x86_64.tar.gz dist/omnicode-linux-aarch64.tar.gz dist/SHA256SUMS --generate-notes
          fi
